name: alot
description: "AloT - Smart Home IoT Control App"
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.12.2

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8
  provider: ^6.1.2
  shared_preferences: ^2.3.2
  http: ^1.2.2
  google_fonts: ^6.2.1
  flutter_animate: ^4.5.0
  font_awesome_flutter: ^11.0.0
  lottie: ^3.1.2
  shimmer: ^3.0.0
  fl_chart: ^0.69.0
  animated_toggle_switch: ^0.8.5
  mqtt_client: ^10.11.11
  google_sign_in: ^6.2.1
  flutter_dotenv: ^6.0.1
  flutter_local_notifications: ^22.0.1
dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true

  assets:
    - .env
