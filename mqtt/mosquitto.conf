# ─────────────────────────────────────────────────────────────────────
# MOSQUITTO CONFIG — HIGH PERFORMANCE & ULTRA-LOW LATENCY REALTIME
# ─────────────────────────────────────────────────────────────────────

# ── Listener 1: TCP MQTT (Backend Node.js nội bộ) ──
listener 1883 127.0.0.1
protocol mqtt
allow_anonymous true

# ── Listener 2: WebSocket port 9001 (Cloudflare Tunnel → đây) ──
listener 9001 0.0.0.0
protocol websockets
allow_anonymous true

# ── CẤU HÌNH TỐC ĐỘ SIÊU THỰC (REAL-TIME LOW LATENCY) ──
# Tắt thuật toán TCP Nagle -> Gửi gói tin đi ngay lập tức (triệt tiêu độ trễ 40-200ms)
set_tcp_nodelay true

# Cho phép gửi không giới hạn gói tin song song (Zero delay queuing)
max_inflight_messages 0
max_queued_messages 0

# Tắt tính toán định kỳ hệ thống không cần thiết để tối ưu CPU & RAM
sys_interval 0

# ── Log & Cache ──
log_type error
log_type warning
log_dest stdout

persistence true
persistence_location C:\Program Files\mosquitto\data\

max_packet_size 65536