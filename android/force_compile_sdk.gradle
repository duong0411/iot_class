// Some Flutter plugins (file_picker, background service) still ship compileSdk 34.
// Newer Flutter Android libraries require 36, so raise every plugin after its own
// android {} block has run. withPlugin alone is too early and gets overwritten.
subprojects { sub ->
    def raise = { ext ->
        ext.compileSdk = 36
    }
    sub.pluginManager.withPlugin("com.android.library") {
        sub.androidComponents.finalizeDsl(raise)
    }
    sub.pluginManager.withPlugin("com.android.application") {
        sub.androidComponents.finalizeDsl(raise)
    }
}
